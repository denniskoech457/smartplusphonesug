<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartPay Admin</title><style>body{font:16px system-ui;background:#f3f6fa;color:#14243c;margin:0}main{max-width:1100px;margin:32px auto;padding:16px}.card{background:white;border-radius:14px;padding:22px;margin:15px 0;box-shadow:0 2px 10px #0001}input,textarea,select,button{font:inherit;padding:10px;box-sizing:border-box}input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px}label{display:block;margin:12px 0}button{border:0;border-radius:8px;background:#155eef;color:white;cursor:pointer;margin:5px}nav button{background:#334155}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}small{color:#475569}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;text-align:left;padding:8px}#app{display:none}.error{color:#b42318}a{color:#155eef}</style><main><a href="/">← Website</a><h1>SmartPay Admin Dashboard</h1><p id="notice" role="status"></p><section class="card" id="login"><h2>Administrator sign in</h2><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button></form></section><section id="app"><button id="logout">Sign out</button><nav><button data-tab="settings">Business & footer</button><button data-tab="hours">Opening hours</button><button data-tab="products">Phones</button><button data-tab="orders">Orders</button></nav><section class="card tab" id="settings"><h2>Business and footer details</h2><form id="settingsForm"><div class="grid" id="settingsFields"></div><button>Save settings</button></form></section><section class="card tab" id="hours" hidden><h2>Opening hours</h2><form id="hoursForm"><div id="hoursFields"></div><button>Save hours</button></form></section><section class="card tab" id="products" hidden><h2>Phones and stock</h2><div id="productList"></div><h3>Add / edit phone</h3><form id="productForm"><input type="hidden" name="id"><div class="grid" id="productFields"></div><label>Visible <input style="width:auto" name="is_active" type="checkbox" checked></label><button>Save phone</button><button type="button" id="clearProduct">Clear form</button></form></section><section class="card tab" id="orders" hidden><h2>Customer applications</h2><div style="overflow-x:auto" id="orderList"></div></section></section></main><script type="module" src="/js/smartpay-admin.bundle.js"></script></html>
